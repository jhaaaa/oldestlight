<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLDEST LIGHT: Decode a poem from the Cosmic Microwave Background</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="OLDEST LIGHT: Decode a poem from the Cosmic Microwave Background">
  <meta property="og:description" content="Decode a poem from the Cosmic Microwave Background — light that has been traveling for 13.8 billion years.">
  <meta property="og:image" content="https://oldestlight.space/static/cmb_map.jpg">
  <meta property="og:url" content="https://oldestlight.space">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OLDEST LIGHT: Decode a poem from the Cosmic Microwave Background">
  <meta name="twitter:description" content="Decode a poem from the Cosmic Microwave Background — light that has been traveling for 13.8 billion years.">
  <meta name="twitter:image" content="https://oldestlight.space/static/cmb_map.jpg">
  <link rel="preload" as="image" href="/static/cmb_map.webp" type="image/webp">
  <link rel="stylesheet" href="/static/css/style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6WR4PDSRCW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6WR4PDSRCW');
  </script>
</head>
<body>

  <nav>
    <div class="site-name-group">
      <span class="site-name">OLDEST LIGHT</span>
      <span class="site-tagline">Planck 2018 SMICA map of the Cosmic Microwave Background</span>
    </div>
    <a href="/about" class="nav-about">ABOUT</a>
  </nav>

  <div id="map-container">
    <picture>
      <source srcset="/static/cmb_map.webp" type="image/webp">
      <img id="cmb-map" src="/static/cmb_map.jpg" alt="Cosmic Microwave Background">
    </picture>
    <canvas id="depth-canvas"></canvas>
    <canvas id="cosmic-web-canvas"></canvas>

    <canvas id="grid-canvas"></canvas>
  </div>

  <div id="hint">Click a block to decode a poem from the Cosmic Microwave Background</div>

  <!-- Transmission bubble -->
  <div id="bubble" class="hidden">
    <button id="bubble-close">✕</button>

    <div id="bubble-inner">
      <div class="coords-label">GALACTIC COORDINATES</div>
      <div class="bubble-coords">
        <span id="bubble-glon"></span>
        <span id="bubble-glat"></span>
      </div>

      <div id="bubble-notable" class="bubble-notable hidden"></div>

      <div class="bubble-section">
        <div class="section-label">
          TRANSMISSION
          <span id="transmission-status" class="transmission-status"></span>
          <button id="bubble-copy" class="bubble-copy hidden" title="Copy to clipboard">⧉</button>
        </div>
        <div id="bubble-message" class="bubble-message"></div>
        <div id="bubble-date" class="bubble-date"></div>
        <div id="bubble-decoder" class="bubble-decoder hidden"></div>
      </div>

      <div class="bubble-section" id="bubble-temps-section">
        <div class="section-label">SIGNAL TEMPERATURES</div>
        <div id="bubble-temps" class="bubble-temps"></div>
      </div>

      <div class="bubble-section">
        <div class="section-label">SIGNAL WORDS</div>
        <div id="bubble-words" class="bubble-words"></div>
      </div>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
